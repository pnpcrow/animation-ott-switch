name: Check and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:identity
      - run: npm run check
      - run: npm run test:decision-eval
      - run: npm run test:decision-eval-v2
      - run: npm run test:light-dom
      - run: npm run test:dom-adaptation
      - run: npm run test:dom-scale
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ott-switch-private-build
          path: release/*.zip
          retention-days: 14
